run: docker compose up --build
seed: docker compose exec api python -m scripts.seed
test: pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  ingest: POST /images/ingest
  start_job: POST /jobs/process
  job_status: GET /jobs/{id}
  images: GET /images
  post_images: GET /posts/{id}/images
  force_check: POST /posts/{id}/check
  review: POST /suggestions/{id}/review
  inspect: GET /suggestions/{id}
  costs: GET /costs
eval: docker compose exec api python -m scripts.eval
