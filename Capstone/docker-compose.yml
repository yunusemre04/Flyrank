services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: imagematch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d imagematch"]
      interval: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env            # cp .env.example .env first
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/imagematch
      IMAGE_DIR: /app/data/images
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
